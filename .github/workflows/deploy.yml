name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docks
          POSTGRES_PASSWORD: docks
          POSTGRES_DB: docks_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U docks -d docks_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://docks:docks@localhost:5432/docks_test
      DOCKS_TEST_DATABASE_URL: postgresql://docks:docks@localhost:5432/docks_test
      BETTER_AUTH_SECRET: ci-test-only-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docks/db build
      - run: pnpm --filter @docks/db db:migrate
      - run: pnpm --filter @docks/api typecheck
      - run: pnpm --filter @docks/api test
      - run: pnpm --filter @docks/api build
      - run: pnpm --filter @docks/server typecheck
      - run: pnpm --filter @docks/web test
      - run: pnpm --filter @docks/web build
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docks/db build && pnpm --filter @docks/api build
      - name: Migrate database (Supabase direct connection)
        run: pnpm --filter @docks/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          command: deploy
      - name: Deploy web Worker
        run: pnpm --filter @docks/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SERVER_URL: ${{ vars.NEXT_PUBLIC_SERVER_URL }}
