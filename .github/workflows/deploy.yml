name: CI and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docks
          POSTGRES_PASSWORD: docks
          POSTGRES_DB: docks_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U docks -d docks_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://docks:docks@localhost:5432/docks_test
      DOCKS_TEST_DATABASE_URL: postgresql://docks:docks@localhost:5432/docks_test
      BETTER_AUTH_SECRET: ci-test-only-secret-at-least-32-characters
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
      NEXT_PUBLIC_POSTHOG_KEY: phc_e2e_test_project
      NEXT_PUBLIC_POSTHOG_HOST: /ingest
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build database package
        run: pnpm --filter @docks/db build
      - name: Apply and repeat migrations on disposable database
        run: |
          pnpm --filter @docks/db db:migrate
          pnpm --filter @docks/db db:migrate
      - name: API types and unit/integration tests
        run: |
          pnpm --filter @docks/api typecheck
          pnpm --filter @docks/api test
          pnpm --filter @docks/api build
      - name: Server and browser test types
        run: |
          pnpm --filter @docks/server typecheck
          pnpm --filter @docks/server test
          pnpm --filter @docks/web typecheck:e2e
      - name: Web unit tests and production Next.js build
        run: |
          pnpm --filter @docks/web test
          pnpm --filter @docks/web build
      - name: Install browser
        run: pnpm --filter @docks/web exec playwright install --with-deps chromium
      - name: Desktop and mobile authenticated end-to-end tests
        run: pnpm --filter @docks/web test:e2e
      - name: Validate API Worker bundle
        run: pnpm --filter @docks/server exec wrangler deploy --dry-run --outdir .wrangler/release
      - name: Build production Cloudflare web artifact
        run: pnpm --filter @docks/web run build:cloudflare
        env:
          DOCKS_SOURCE_MAPS: "1"
          NEXT_PUBLIC_RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SERVER_URL: https://api.devzshrc.in
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Save tested web release artifact
        run: tar -czf /tmp/docks-web-release.tgz -C apps/web .open-next
      - uses: actions/upload-artifact@v4
        with:
          name: web-release-${{ github.sha }}
          path: /tmp/docks-web-release.tgz
          retention-days: 7
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://docks.devzshrc.in/admin
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/scripts/certs/supabase-root-2021.crt
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment credentials before making changes
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment secret: $name (DATABASE_URL uses DATABASE_URL_DIRECT)"
              missing=1
            fi
          done
          exit "$missing"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-release-${{ github.sha }}
          path: /tmp/web-release
      - name: Restore tested Cloudflare artifact
        run: tar -xzf /tmp/web-release/docks-web-release.tgz -C apps/web
      - run: pnpm --filter @docks/db build && pnpm --filter @docks/api build
      - name: Migrate production database before deploying API
        run: pnpm --filter @docks/db db:migrate
      - name: Upload browser source maps to PostHog
        if: vars.POSTHOG_SOURCE_MAPS_ENABLED == 'true'
        uses: PostHog/upload-source-maps@bbfc8eae6d9ecc63109d0616514e2d4227282558
        with:
          directory: apps/web/.open-next/assets
          api-key: ${{ secrets.POSTHOG_CLI_API_KEY }}
          project-id: ${{ vars.POSTHOG_PROJECT_ID }}
          release-name: docks-web
          release-version: ${{ github.sha }}
          cli-version: "0.18.10"
          delete-after-upload: true
      - name: Remove browser source maps from public assets
        run: node scripts/remove-public-source-maps.mjs
      - name: Deploy API Worker
        run: pnpm --filter @docks/server exec wrangler deploy --var RELEASE_SHA:${{ github.sha }}
      - name: Deploy tested web Worker artifact
        run: pnpm --filter @docks/web exec opennextjs-cloudflare deploy
      - name: Verify production routes and authentication guard
        run: node scripts/smoke-deploy.mjs
      - name: Record successful production release
        run: pnpm --filter @docks/server exec node scripts/record-deploy.mjs
